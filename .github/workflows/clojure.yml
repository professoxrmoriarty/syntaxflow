name: Clojure CI

on:
  push:
    branches: [ "english-edition" ]
  pull_request:
    branches: [ "english-edition" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: lein deps
    - name: Run tests
      run: lein test
